name: BGG Sync

on:
  workflow_dispatch: # Ejecución manual; Vercel Cron es el scheduler principal.

jobs:
  sync-ranked:
    runs-on: ubuntu-latest
    steps:
      - name: Sync ranked games
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            "https://ludumgames.es/api/sync-bgg?mode=ranked&batch=100" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -w "\nHTTP Status: %{http_code}\n"

  sync-new:
    runs-on: ubuntu-latest
    steps:
      - name: Sync new games
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            "https://ludumgames.es/api/sync-bgg?mode=new&batch=200" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -w "\nHTTP Status: %{http_code}\n"
